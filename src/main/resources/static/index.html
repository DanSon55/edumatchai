<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭдуМатч - Подбор университетов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="services/languageService.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.0/dist/chart.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">EduMatch AI</a>
            <div class="d-flex">
                <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-light" onclick="window.languageService.setLanguage('ru')">RU</button>
                    <button type="button" class="btn btn-outline-light" onclick="window.languageService.setLanguage('en')">EN</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="language-selector">
        <select onchange="window.languageService.setLanguage(this.value)">
            <option value="en">English</option>
            <option value="ru">Русский</option>
        </select>
    </div>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <!-- История поиска -->
                <div class="card mb-4">
                    <div class="card-header bg-light">
                        <h5 class="card-title mb-0">История поиска</h5>
                    </div>
                    <div class="card-body">
                        <div id="searchHistory" class="list-group">
                            <!-- Сюда будет добавляться история -->
                        </div>
                    </div>
                </div>

                <!-- Форма поиска -->
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Подбор университета за рубежом</h2>
                        
                        <form id="matchForm">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="country" data-i18n-section="formLabels">Страна обучения</label>
                                        <select name="country" class="form-select" required>
                                            <option value="США">США</option>
                                            <option value="Великобритания">Великобритания</option>
                                            <option value="Канада">Канада</option>
                                            <option value="Австралия">Австралия</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="specialty" data-i18n-section="formLabels">Специальность</label>
                                        <select name="specialty" class="form-select" required>
                                            <option value="Информатика">Информатика</option>
                                            <option value="Бизнес">Бизнес</option>
                                            <option value="Инженерия">Инженерия</option>
                                            <option value="Медицина">Медицина</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="gpa" data-i18n-section="formLabels">GPA (из 4.0)</label>
                                        <input type="number" id="gpa" name="gpa" class="form-control" step="0.1" min="0" max="4" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="ielts" data-i18n-section="formLabels">IELTS</label>
                                        <input type="number" id="ielts" name="ielts" class="form-control" step="0.5" min="1" max="9" required>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="sat" data-i18n-section="formLabels">SAT</label>
                                        <input type="number" id="sat" name="sat" class="form-control" step="10" min="400" max="1600" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="admissionYear" data-i18n-section="formLabels">Год поступления</label>
                                        <select name="admissionYear" class="form-select" required>
                                            <option value="2024">2024</option>
                                            <option value="2025">2025</option>
                                            <option value="2026">2026</option>
                                            <option value="2027">2027</option>
                                            <option value="2028">2028</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="targetType" data-i18n-section="formLabels">Тип университета</label>
                                        <select name="targetType" class="form-select" required>
                                            <option value="топ-10">Топ 10</option>
                                            <option value="топ-50">Топ 50</option>
                                            <option value="топ-100">Топ 100</option>
                                            <option value="топ-200">Топ 200</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="budget" data-i18n-section="formLabels">Бюджет на год (USD)</label>
                                        <input type="number" id="budget" name="budget" class="form-control" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" data-i18n="familyIncome" data-i18n-section="formLabels">Годовой доход семьи (USD)</label>
                                        <input type="number" id="familyIncome" name="familyIncome" class="form-control" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" data-i18n="activities" data-i18n-section="formLabels">Достижения и активности</label>
                                <textarea name="activities" class="form-control" rows="3" placeholder="Опишите ваши олимпиады, проекты, волонтёрство..."></textarea>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" name="campusLife" class="form-check-input" id="campusLife">
                                    <label class="form-check-label" for="campusLife" data-i18n="campusLife" data-i18n-section="formLabels">
                                        Важна активная студенческая жизнь
                                    </label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="form-check">
                                    <input type="checkbox" name="wantWorkAfter" class="form-check-input" id="wantWorkAfter">
                                    <label class="form-check-label" for="wantWorkAfter" data-i18n="wantWorkAfter" data-i18n-section="formLabels">
                                        Планирую работать в стране после учёбы
                                    </label>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100" data-i18n="submit" data-i18n-section="buttons">Найти университеты</button>
                        </form>
                    </div>
                </div>

                <!-- Результаты -->
                <div id="results" class="mt-4 d-none">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 data-i18n="results" data-i18n-section="headings">Результаты подбора</h3>
                        <div class="btn-group">
                            <button id="exportPDF" class="btn btn-secondary">
                                <i class="bi bi-file-pdf"></i> <span data-i18n="savePDF" data-i18n-section="buttons">Сохранить PDF</span>
                            </button>
                            <button id="shareResults" class="btn btn-outline-primary">
                                <i class="bi bi-share"></i> <span data-i18n="share" data-i18n-section="buttons">Поделиться</span>
                            </button>
                        </div>
                    </div>
                    <div id="universitiesList"></div>
                </div>

                <div class="analytics-section">
                    <h2 data-i18n="analytics.statistics">Statistics</h2>
                    <div class="charts-container">
                        <canvas id="acceptanceRateChart"></canvas>
                        <canvas id="costDistributionChart"></canvas>
                        <canvas id="employmentChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize language service
            window.languageService.updatePageText();

            // Add language switcher handler
            document.getElementById('languageSelect').addEventListener('change', (e) => {
                window.languageService.setLanguage(e.target.value);
            });

            // Set initial language select value
            document.getElementById('languageSelect').value = 
                window.languageService.currentLanguage;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components/loading.js"></script>
    <script src="components/charts.js"></script>
    <script src="utils/pdfExport.js"></script>
    <script src="filters.js"></script>
    <script src="sorting.js"></script>
    <script src="comparison.js"></script>
    <script src="validation.js"></script>
    <script src="history.js"></script>
    <script src="components/analytics.js"></script>
    <script src="app.js"></script>
</body>
</html>
